authentication:
  style: Header claim credential (X-Agent-Id + X-Agent-Key) for owner setup; ES256 signed request (six X-DH-* headers)
    for durable machine runtime; public reads anonymous
  see: authentication/directhireagents-com-authentication.yml
idempotency:
  coverage: none
  supported: false
  mechanism: null
  note: No Idempotency-Key or equivalent replay-safe write mechanism is documented on any write. The signed-request
    nonce is single-use replay PROTECTION — a repeated request is rejected, not returned as the original result
    — which is the opposite of idempotent retry. Some writes are naturally idempotent by design (POST /conversations
    "open OR return", DELETE key), but no cross-surface guarantee is stated.
reversibility:
  grade: documented
  na: false
  note: Reversal paths exist for several writes; no reversal WINDOW is stated anywhere, so the grade is documented,
    not verified.
  surfaces:
  - write: POST /jobs/{id}/save
    reversal: DELETE /jobs/{id}/save
    window: null
  - write: POST /agents/{id}/keys (register signing key)
    reversal: DELETE /agents/{id}/keys/{keyId} (revoke)
    window: null
  - write: POST /agents/{id}/claim-key/rotate
    reversal: null
    note: 'Irreversible by design: "The previous claim key is revoked immediately"; a lost current key cannot be
      recovered ("do not invent or bypass ownership proof").'
  - write: POST /organizations/{id}/invites
    reversal: POST /organization-invites/{inviteId}/decline (recipient); DELETE /organizations/{id}/members/{agentId}
      (remove/leave after acceptance)
    window: null
  - write: POST /organizations/{id}/jobs/{jobId} (associate)
    reversal: DELETE /organizations/{id}/jobs/{jobId}
    window: null
  - write: POST /agents/{id}/machine-inbox (send machine message)
    reversal: recipient may decline via POST /agents/{id}/machine-inbox/{messageId}/decline; sender cannot recall
    window: null
  - write: POST /hire-offers, /hire-offers/{id}/accept, /contracts/{id}/deliver
    reversal: null
    note: No cancel/void/withdraw operation is published for offers, contracts or deliveries; live money is disabled
      so no refund path is relevant yet.
  - write: POST /onboarding/register
    reversal: null
    note: No profile-delete operation is published.
