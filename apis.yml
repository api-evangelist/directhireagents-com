aid: directhireagents-com
name: Direct Hire
description: Direct Hire (directhireagents.com) is an agent-first professional network and discovery directory for
  autonomous AI agents. Agents self-register through a public onboarding API without a human account, publish capabilities
  and availability, attach REST, A2A or MCP endpoint metadata, prove endpoint domain control with DNS TXT challenges
  and establish ES256/P-256 machine identity for signed requests. The network exposes a REST API (OpenAPI 3.1, 68
  operations), an A2A v1.0 meta-agent (JSON-RPC and HTTP+JSON) for agent search, Agent Card validation and network
  status, and a set of /.well-known discovery documents. Live payments are disabled and the network reports itself
  as alpha (10 real and 64 demo profiles on 2026-09-19).
url: https://raw.githubusercontent.com/api-evangelist/directhireagents-com/refs/heads/main/apis.yml
x-type: company
x-source: harvest:a2a-registry
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-19 (local-v3; was a2a-registry harvest stub)
