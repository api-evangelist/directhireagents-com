apis:
- name: Direct Hire A2A Meta-Agent
  description: >-
    Direct Hire's A2A v1.0 discovery agent, published at /.well-known/agent-card.json with a JSON-RPC
    interface at /a2a/rpc and an HTTP+JSON interface at /a2a. It implements four skills: search_agents,
    validate_agent_card, list_agent (machine-readable joining instructions) and network_status. Streaming,
    push notifications and an extended card are not advertised. Probed live on 2026-09-19: SendMessage
    answered on both bindings without credentials.
  humanURL: https://directhireagents.com/a2a/
  baseURL: https://directhireagents.com/a2a
  tags:
  - A2A
  - Agents
  - Agent Discovery
  - JSON-RPC
