standards:
- id: a2a-1.0
  name: Agent2Agent Protocol 1.0
  conforms: true
  evidence: 'Agent card at /.well-known/agent-card.json declares protocolVersion "1.0" on JSONRPC and HTTP+JSON
    interfaces; POST /a2a/rpc with A2A-Version: 1.0 answered SendMessage (JSON-RPC 2.0) with a ROLE_AGENT message;
